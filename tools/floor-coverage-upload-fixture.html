<!doctype html><meta charset="utf-8"><title>Forest floor coverage upload replay</title><style>body{margin:0}canvas{display:block}</style>
<script type="module">
import * as THREE from 'three';
import {buildForestFloor as before} from '/src/presentation/__baseline-floor.ts';
import {buildForestFloor as after} from '/src/presentation/forestFloor.ts';
import {Terrain} from '/src/world/terrain.ts';
import {Exclusions} from '/src/presentation/vegetation.ts';
import {createInitialState} from '/src/game/state.ts';
import {worldView} from '/src/game/worldView.ts';
try {
 const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(320,180);document.body.append(renderer.domElement);
 const gl=renderer.getContext();let uploadBytes=0,uploadCalls=0;
 for(const method of ['bufferData','bufferSubData']){const original=gl[method];gl[method]=function(...args){const data=args[method==='bufferData'?1:2];if(typeof data==='number')uploadBytes+=data;else if(data){const bpe=data.BYTES_PER_ELEMENT??1,offset=method==='bufferData'?0:(args[3]??0),length=method==='bufferData'?0:(args[4]??0);uploadBytes+=(length||data.byteLength/bpe-offset)*bpe;}uploadCalls++;return Reflect.apply(original,this,args);};}
 const terrain=new Terrain(),exclusions=new Exclusions(terrain),view=worldView(createInitialState());
 const run=build=>{
  const floor=build(terrain,exclusions,'medium'),scene=new THREE.Scene();scene.background=new THREE.Color(0x87989b);scene.add(floor.group,new THREE.HemisphereLight(0xdbe4da,0x433b29,2));const sun=new THREE.DirectionalLight(0xffe4be,2);sun.position.set(2,6,3);scene.add(sun);
  const ground=new THREE.PlaneGeometry(100,100,32,32),position=ground.getAttribute('position');ground.rotateX(-Math.PI/2);ground.translate(-182,0,10);for(let i=0;i<position.count;i++)position.setY(i,terrain.heightAt(position.getX(i),position.getZ(i)));ground.computeVertexNormals();scene.add(new THREE.Mesh(ground,new THREE.MeshStandardMaterial({color:0x4a4c30,roughness:1})));
  const camera=new THREE.PerspectiveCamera(65,320/180,.1,220);camera.position.set(-182,terrain.heightAt(-182,10)+3,10);camera.lookAt(-170,camera.position.y-1,0);camera.updateMatrixWorld();const yaw=camera.rotation.y;
  const frame={camera,time:0,focus:camera.position.clone(),nightness:0,sunDir:new THREE.Vector3(.4,1,.6).normalize(),reducedMotion:false,hour:9,view,quality:'medium'};
  floor.update(1,frame);renderer.render(scene,camera);const frames=[],images=[];
  for(let i=0;i<24;i++){
   camera.rotation.y=yaw+(i+1)*.0001;if(i>=18)camera.position.x+=.02;camera.updateMatrixWorld();uploadBytes=uploadCalls=0;
   floor.update(1/60,frame);renderer.render(scene,camera);
   frames.push({stage:i<18?'turn':'walk',uploadBytes,uploadCalls,draws:renderer.info.render.calls,triangles:renderer.info.render.triangles,drawn:floor.stats().forestFloorDrawn});
   if(i===0||i===17||i===23)images.push(renderer.domElement.toDataURL());
  }
  const glError=gl.getError(),contextLost=gl.isContextLost();floor.dispose();ground.dispose();return{frames,images,glError,contextLost};
 };
 window.floorUploadProof={before:run(before),after:run(after)};
}catch(e){window.floorUploadError=String(e?.stack??e);}
</script>
