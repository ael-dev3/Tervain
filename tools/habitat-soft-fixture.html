<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}canvas{display:block}</style></head><body><script>window.addEventListener('error',e=>window.fixtureError=e.message);window.addEventListener('unhandledrejection',e=>window.fixtureError=String(e.reason));</script><script type="module">
import * as THREE from 'three';
import {Terrain} from '/src/world/terrain.ts';
import {Colliders} from '/src/world/colliders.ts';
import {Exclusions} from '/src/presentation/vegetation.ts';
import {createGrassField} from '/src/presentation/grass/grassField.ts';
import {GrassWind} from '/src/presentation/grass/wind.ts';
const mode=new URLSearchParams(location.search).get('mode');const {Habitat}=await import(mode==='baseline'?'/@baseline-habitat':'/src/presentation/ground/habitat.ts');
const terrain=new Terrain(),habitat=new Habitat({terrain,colliders:new Colliders(),excl:new Exclusions(terrain)}),wind=new GrassWind({direction:[1,.3],steady:.12,gust:.25,speed:1});wind.update(.1);
const field=createGrassField(terrain,habitat,'high',wind,null),camera=new THREE.PerspectiveCamera(50,4/3,.1,250),y=terrain.heightAt(-7,45);camera.position.set(-7,y+1.8,41);camera.lookAt(-7,y+.7,49);camera.updateMatrixWorld();field.update(camera.position);

</script></body></html>
