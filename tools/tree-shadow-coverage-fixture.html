<!doctype html><html><body style="margin:0"><script type="module">
import * as THREE from 'three';
import {PINE_FILES} from '/src/presentation/solitaryPine.ts';

import {createInitialState} from '/src/game/state.ts';

  const build = new URLSearchParams(location.search).get('mode') === 'baseline' ? baseline : current;
  const terrain = new Terrain(), wind = new GrassWind(REALM_WIND);

  const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(50,120,80);sun.target.position.set(18,0,20);sun.castShadow=true;sun.shadow.mapSize.set(128,128);Object.assign(sun.shadow.camera,{left:-150,right:150,top:150,bottom:-150,near:.1,far:500});sun.shadow.camera.updateProjectionMatrix();scene.add(sun,sun.target);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;installShadowOnlyGroup(scene,sun,forest.shadowCasters);sun.updateMatrixWorld();sun.target.updateMatrixWorld();sun.shadow.updateMatrices(sun);

</script></body></html>
