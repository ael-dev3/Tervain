<!doctype html><meta charset="utf-8"><title>Single shadow matrix cache</title>
<script type="module">
import * as THREE from 'three';
import {cacheSingleDirectionalShadowMatrix} from '/src/presentation/foliage/singleShadowMatrix.ts';
try{
 const R=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});R.setSize(192,128);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFShadowMap;R.info.autoReset=false;document.body.append(R.domElement);
 const gl=R.getContext(),names=new WeakMap(),getLocation=gl.getUniformLocation,upload=gl.uniformMatrix4fv;let calls=0,bytes=0;

}catch(e){window.fixtureError=String(e.stack??e);}
</script>
