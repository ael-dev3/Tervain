<!doctype html><meta charset="utf-8"><title>Shared geometry alpha-cutout audit fixture</title><style>body{margin:0;background:#18222b;color:#fff;font:16px sans-serif}p{margin:12px}canvas{display:block}</style><p>Opaque cards (left) · alpha-cutout islands (right). Diagnostic fixture; no production art changes.</p><script type="module">
import * as THREE from 'three';

try{
 const wood=new THREE.BoxGeometry(.4,2,.4),leaves=mergeGeometries([.5,2.5].map(x=>new THREE.PlaneGeometry(2,.5).translate(x,1,0)));

 const counts=r=>Object.fromEntries(r.trees.map(t=>[t.label,t.candidates.length]));
 const report={expected:{full:0,masked:1},orders:[]};
 for(const reverse of [false,true]){const input=reverse?[...targets].reverse():targets;report.orders.push({reverse,before:counts(before(input,{alpha:true})),after:counts(after(input,{alpha:true})),solo:Object.fromEntries(input.map(t=>[t.label,before([t],{alpha:true}).trees[0].candidates.length]))});}

 for(let i=0;i<2;i++){
  const bytes=new Uint8Array(32*8*4);for(let p=0;p<32*8;p++){bytes[p*4]=bytes[p*4+1]=bytes[p*4+2]=255;bytes[p*4+3]=i===0||p%32<6?255:0;}

 }

</script>
