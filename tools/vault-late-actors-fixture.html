<!doctype html><html><body style="margin:0"><script type="module">
import * as THREE from 'three';
import {Colliders} from '/src/world/colliders.ts';
import {createHeroRig} from '/src/presentation/hero/rig.ts';
import {createGltfLoader} from '/src/presentation/assets/gltfLoader.ts';
try {
const mode=new URLSearchParams(location.search).get('mode');
const {Player}=await import(mode==='before'?'/src/presentation/__baseline-player.ts':'/src/presentation/__candidate-player.ts');
const player=new Player(createHeroRig(await createGltfLoader().loadAsync('/models/hero/weathered-wanderer-hero-sealed.glb')));
const rows=[];let shown;
for(const yaw of [0,Math.PI/4])for(const slope of [-.15,0,.15]) {
 const ground=(x,z)=>(x*Math.cos(yaw)-z*Math.sin(yaw))*slope;
 const terrain={heightAt:ground,groundAt:ground,supportAt:ground,walkable:()=>true};
 const colliders=new Colliders();colliders.box('fence',0,0,.12,3,yaw,true,{minY:-.3,maxY:1.7});
 const cos=Math.cos(yaw),sin=Math.sin(yaw);
 for(const hz of [30,60,120])for(const distance of [.55,.8,1.5,1.85])for(const lateAt of [.1,.2,.3])for(const kind of ['resident','enemy','wildlife'])for(const obstacle of ['landing','nearby','inactive','overhead']) {
  const ctx={terrain,colliders,audio:{land(){}},npcs:[],enemies:[],game:{state:{npcs:{late:{available:true}}}}};
  player.setPosition(-distance*cos,distance*sin,Math.PI/2+yaw,terrain);
  const v=player.fenceVault(ctx);if(!v)throw Error('Initially clear vault rejected');player.vault=v;player.grounded=false;
  const actor={id:'late',x:v.to.x+(obstacle==='nearby'?2*sin:0),z:v.to.z+(obstacle==='nearby'?2*cos:0),y:v.to.y+(obstacle==='overhead'?5:0)};
  const gap=()=>Math.hypot(player.x-actor.x,player.z-actor.z)-.75;
  const overlap=()=>obstacle!=='inactive'&&player.y+1.95>actor.y&&player.y<actor.y+2.1&&gap()<-.001;
  const path=[];let injected=false,minimum=0,deepFrames=0,aborted=false,steps=0,injectionOverlap=false,position;
  while(player.vault&&steps++<1000) {
   if(!injected&&v.t>=lateAt) {
    injected=true;
    if(kind==='resident')ctx.npcs=[{...actor,hidden:obstacle==='inactive'}];
    if(kind==='enemy')ctx.enemies=[{...actor,alive:obstacle!=='inactive',radius:.35}];
    if(kind==='wildlife')ctx.wildlifeContacts=[{...actor,active:obstacle!=='inactive',kind:'circle',r:.35,minY:actor.y,maxY:actor.y+2.1}];
    injectionOverlap=overlap();
   }
   player.stepVault(1/hz,ctx);path.push([player.x,player.y,player.z,!!player.vault]);
   if(injected&&overlap()){deepFrames++;if(gap()<minimum){minimum=gap();position={x:player.x,y:player.y,z:player.z};}}
   if(!player.vault&&v.t<1){aborted=true;position={x:player.x,y:player.y,z:player.z};}
  }
  if(steps>=1000)throw Error('Vault did not terminate');
  rows.push({path,yaw,slope,hz,distance,lateAt,kind,obstacle,minimum,deepFrames,aborted,grounded:player.grounded,injectionOverlap});
  if(yaw===0&&slope===0&&hz===60&&distance===.8&&lateAt===.2&&kind==='resident'&&obstacle==='landing')shown={position:position??{x:player.x,y:player.y,z:player.z},actor};
 }
}
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(640,360);document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x252c35);
const add=(geometry,color,position)=>{const mesh=new THREE.Mesh(geometry,new THREE.MeshBasicMaterial({color,wireframe:true}));mesh.position.copy(position);scene.add(mesh);};
add(new THREE.BoxGeometry(.24,1.1,6),0xb2905e,new THREE.Vector3(0,.55,0));
add(new THREE.CylinderGeometry(.35,.35,2.1,16),0xffb347,new THREE.Vector3(shown.actor.x,shown.actor.y+1.05,shown.actor.z));
add(new THREE.CapsuleGeometry(.4,1.15,8,16),0x56bdda,new THREE.Vector3(shown.position.x,shown.position.y+.975,shown.position.z));
const camera=new THREE.PerspectiveCamera(45,640/360,.1,100);camera.position.set(4,3.5,5);camera.lookAt(0,1,0);renderer.render(scene,camera);
const costs=globalThis.__renderCostStates.get(renderer.getContext());
window.vaultProof={diagnosticRender:{drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,lines:renderer.info.render.lines,textures:renderer.info.memory.textures,uploadBytes:costs.uploads},rows,nativeHero:!!player.rig.hero,cases:rows.length,penetratingCases:rows.filter(r=>r.deepFrames>0).length,worstPenetration:Math.min(...rows.map(r=>r.minimum)),blockedAborts:rows.filter(r=>r.obstacle==='landing'&&r.aborted).length,clearAborts:rows.filter(r=>r.obstacle!=='landing'&&r.aborted).length,glError:renderer.getContext().getError(),scope:'Delivered hero/controller and ordinary actor collision volumes, inserted after takeoff outside the current player body. Controlled contact replay; wireframe diagnostic image, not visual approval or hardware timing.'};
}catch(e){window.fixtureError=e.stack??String(e);}
</script></body></html>
