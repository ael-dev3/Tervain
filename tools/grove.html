<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tervain grove</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      #grove-controls {
        position: fixed;
        right: 10px;
        bottom: 10px;
        z-index: 20;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 10px;
        background: rgba(18, 18, 16, 0.82);
        color: #e4d7bc;
        font: 13px/1.3 system-ui, sans-serif;
        border: 1px solid #5a5446;
      }
      #grove-controls[hidden] {
        display: none;
      }
      #grove-controls input[type='range'] {
        width: 340px;
      }
      #grove-controls button {
        background: #32332e;
        color: #f0e3c7;
        border: 1px solid #797361;
        padding: 4px 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="view" tabindex="-1"></canvas>
      <div id="ui"></div>
    </div>
    <div id="grove-controls">
      <button type="button" id="grove-play">Play with song</button>
      <input type="range" id="grove-time" min="0" max="214.2" step="0.05" value="40" aria-label="Song time" />
      <output id="grove-clock">0:40.00</output>
    </div>
    <script type="module" src="./grove.ts"></script>
  </body>
</html>
