<!doctype html><meta charset="utf-8"><title>Selected crown LOD coverage repro</title><style>body{margin:0}canvas{display:block}</style>
<script type="module">
import * as THREE from 'three';
import {auditLiveCrowns as before} from '/tools/__before-crowns.mjs';
import {auditLiveCrowns as after} from '/tools/__after-crowns.mjs';
import {crownCoverageComplete} from '/tools/crown-source-coverage.mjs';
try{
 const scene=new THREE.Scene();scene.background=new THREE.Color(0x263237);
 const make=(kind,displayX)=>{
  const group=new THREE.Group(),families=[];let nearWood;
  for(let lod=0;lod<3;lod++)for(const part of ['wood','foliage']){
   if(lod===2&&(kind==='missing-both'||kind==='leaf-only'&&part==='wood'))continue;
   const geometry=part==='wood'?new THREE.BoxGeometry(.3,2,.3).translate(0,1,0):new THREE.BoxGeometry(1,.6,1).translate(0,1.7,0);
   geometry.setAttribute('aDistanceCoverage',new THREE.InstancedBufferAttribute(new Float32Array([0,1]),2));
   const mesh=new THREE.InstancedMesh(geometry,new THREE.MeshBasicMaterial({color:part==='wood'?0xa16d44:0x7da44b}),1);mesh.name=`pine:${lod}:${part}`;mesh.setMatrixAt(0,new THREE.Matrix4());group.add(mesh);families.push(mesh);
   if(lod===0&&part==='wood')nearWood=geometry;
   if(lod===2){const display=mesh.clone();display.position.x=displayX;scene.add(display);}
  }
  const forest={group,update(){},canopyAuditTargets(lod=0){return[{label:'fixture-pine',species:'pine',kind:'pine',lod,wood:families.find(m=>m.name===`pine:${lod}:wood`)?.geometry??null,leaves:families.find(m=>m.name===`pine:${lod}:foliage`)?.geometry??null,matrix:new THREE.Matrix4()}];}};
  return forest;
 };
 const cases=[['full',make('full',-2)],['leaf-only',make('leaf-only',0)],['missing-both',make('missing-both',2)]];
 const camera=new THREE.PerspectiveCamera(50,720/320,.1,100);camera.position.set(0,2.4,7);camera.lookAt(0,1,0);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(8,4),new THREE.MeshBasicMaterial({color:0x60685c,side:THREE.DoubleSide}));ground.rotation.x=-Math.PI/2;scene.add(ground);
 const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(720,320);document.body.append(renderer.domElement);renderer.render(scene,camera);const initial=renderer.domElement.toDataURL();
 const page={eval:code=>Function('return(async()=>{'+code+'})()')()},rows=[];
 for(const [kind,forest]of cases){window.tervain={world:{modules:[{name:'forest',module:forest}]},cam:{camera},player:{group:new THREE.Group()}};
  const a=await before(page,location.origin),b=await after(page,location.origin);
  const summarize=r=>({expectedTrees:r.expectedTrees,covered:r.levels.map(l=>l.coveredTrees),reported:r.levels.map(l=>l.summary.trees),complete:r.levels.map(l=>l.complete),missing:r.missing.length,transitionSamples:r.transitionSamples});
  rows.push({kind,before:{...summarize(a),measurementPass:a.levels.every(l=>l.complete)&&a.transitionSamples===a.expectedTrees*14},after:{...summarize(b),measurementPass:crownCoverageComplete(b)}});
 }
 renderer.render(scene,camera);const image=renderer.domElement.toDataURL();window.crownSourceProof={rows,pixelsIdentical:initial===image,draws:renderer.info.render.calls,triangles:renderer.info.render.triangles,glError:renderer.getContext().getError(),contextLost:renderer.getContext().isContextLost(),image};
}catch(e){window.crownSourceError=String(e?.stack??e);}
</script>
