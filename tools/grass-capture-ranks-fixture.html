<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}canvas{display:block}</style></head><body><script>window.addEventListener('error',e=>window.fixtureError=e.message);window.addEventListener('unhandledrejection',e=>window.fixtureError=String(e.reason));</script><script type="module">
import * as THREE from 'three';
import {createGrassClump} from '/src/presentation/grass/bladeGeometry.ts';
import {createGrassMaterial} from '/src/presentation/grass/grassMaterial.ts';
import {GrassWind} from '/src/presentation/grass/wind.ts';
const mode=new URLSearchParams(location.search).get('mode');
const {TileLayer}=await import(mode==='baseline'?'/@baseline-tile':'/src/presentation/ground/tileStream.ts');
const wind=new GrassWind({direction:[1,0],steady:0,gust:0,speed:0});
const material=createGrassMaterial({wind,look:{rootShade:.3,tipLift:.3,translucency:1,sheen:0,transTint:new THREE.Color(1,1,1)},farBlades:1,clump:{radius:.3,width:.04,height:.8,blades:6},fade:{start:0,end:100,sizeComp:1,power:1},band:{inStart:-2,inEnd:-1,outStart:10000,outEnd:10001}});

const main=new THREE.PerspectiveCamera(55,4/3,.1,200);main.position.set(70,6,10);main.lookAt(5,0,5);main.updateMatrixWorld();layer.update(main.position);

</script></body></html>
