<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}canvas{display:block}</style></head><body><script>window.addEventListener('error',e=>window.fixtureError=e.message);window.addEventListener('unhandledrejection',e=>window.fixtureError=String(e.reason));</script><script type="module">
import * as THREE from 'three';
const mode=new URLSearchParams(location.search).get('mode');
const {createLeafBurst}=await import(mode==='baseline'?'/@baseline-leaf':'/src/presentation/foliage/leafBurst.ts');
const renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(320,240);document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xcccccc);scene.add(new THREE.AmbientLight(0xffffff,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(3,5,4);scene.add(light);

for(const name of ['bufferData','bufferSubData']){const original=gl[name];gl[name]=function(...args){if(args[1]===source||args[2]===source){const offset=name==='bufferSubData'?args[3]??0:0,count=name==='bufferSubData'?args[4]??(source.length-offset):source.length;uploaded+=count*source.BYTES_PER_ELEMENT;}return original.apply(this,args);};}

window.leafPrefixRepro.step(0);
</script></body></html>
