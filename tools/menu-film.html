<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tervain 0.0.5 — menu film recorder</title>
  </head>
  <body>
    <main id="film-app">
      <section id="film-controls" aria-label="Local menu recording controls">
        <div>
          <strong>Tervain 0.0.5 · native menu recording</strong>
          <p>1920 × 1080 · 30 fps · High quality · animated scene, original menu artwork</p>
        </div>
        <button id="film-test" disabled>Record 5-second test</button>
        <button id="film-record" disabled>Record full song</button>
        <output id="film-status" aria-live="polite">Preparing menu textures and shaders…</output>
        <progress id="film-progress" max="216" value="0" aria-label="Recording progress"></progress>
      </section>
      <canvas id="film-output" width="1920" height="1080" aria-label="Animated Tervain menu preview"></canvas>
    </main>
    <div id="film-layout" aria-hidden="true" inert></div>
    <script type="module" src="/tools/menu-film.ts"></script>
  </body>
</html>
