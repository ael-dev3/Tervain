<!doctype html><title>Struck-leaf dead-slot proof</title><script type="module">
import * as THREE from 'three';
import {createLeafBurst as before} from '/@baseline-struck';
import {createLeafBurst as after} from '/@candidate-struck';
try{
 const renderer=new THREE.WebGLRenderer({preserveDrawingBuffer:true});renderer.setSize(320,240);renderer.setClearColor(0);document.body.append(renderer.domElement);
 const camera=new THREE.PerspectiveCamera(48,4/3,.1,50);camera.position.set(2,3,8);camera.lookAt(0,1.5,0);camera.updateMatrixWorld();
 const hash=async data=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',data))).map(v=>v.toString(16).padStart(2,'0')).join(''),rows=[],images={};
 for(const [mode,create]of [['before',before],['after',after]]){
  let heights=0,writes=0;const burst=create({heightAt(){heights++;return 0}},null),mesh=burst.mesh,original=mesh.setMatrixAt;
  mesh.setMatrixAt=function(...args){writes++;return original.apply(this,args)};
  const scene=new THREE.Scene();scene.add(mesh,new THREE.AmbientLight(0xffffff,2));
  for(let i=0;i<240;i++){
   if(i===0)burst.release(0,0,0,.5,4);
   if(i===5)burst.release(0,4,0,.5,12);
   if(i===60)burst.release(0,1,0,.7,50);
   if(i===130)burst.release(0,2,0,.5,4);
   const oldWrites=writes,oldHeights=heights;burst.update([0,40,80,130].includes(i)?0:.1,i===90||i===100);
   const row={mode,i,writes:writes-oldWrites,heightCalls:heights-oldHeights,active:burst.active,count:mesh.count,visible:mesh.visible,matrixSha:await hash(mesh.instanceMatrix.array.buffer),ranges:mesh.instanceMatrix.updateRanges.map(r=>({...r})),version:mesh.instanceMatrix.version};
   if([0,6,45,61,95,129,131,200,239].includes(i)){
    const cost=window.__renderCostStates.get(renderer.getContext()),start=cost?.uploads??0;
    renderer.render(scene,camera);row.draws=renderer.info.render.calls;row.triangles=renderer.info.render.triangles;row.uploadBytes=(cost?.uploads??0)-start;
    row.textureCount=renderer.info.memory.textures;row.sphere=mesh.boundingSphere?{center:mesh.boundingSphere.center.toArray(),radius:mesh.boundingSphere.radius}:null;
    images[mode+'-'+i]=renderer.domElement.toDataURL();
   }
   row.glError=renderer.getContext().getError();rows.push(row);
  }
  burst.dispose();
 }
 window.struckProof={rows,images};renderer.dispose();
}catch(e){window.fixtureError=String(e.stack??e)}
</script>
