<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tervain · Meshy resident review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#232b2e;color:#eee6d6;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}aside{position:absolute;left:18px;top:18px;width:270px;padding:18px;background:#20282aed;border:1px solid #626157;border-radius:8px}h1{font:600 21px Georgia;margin:0 0 12px}label{display:block;margin-top:12px}select,button{font:inherit;width:100%;margin-top:5px;background:#343e40;color:inherit;border:1px solid #7c8076;border-radius:4px;padding:7px}p{line-height:1.5;color:#c3c5bd}output{white-space:pre-line;font:12px monospace;display:block;margin-top:14px}</style>
<canvas id="view" aria-label="Rotatable Meshy NPC preview"></canvas><aside><h1>Tervain residents</h1><p>Actual game models and skeletal poser. Drag to rotate; scroll to zoom. Check faces, sides, backs and garment motion.</p><label>Resident<select id="resident"></select></label><label>Motion<select id="motion"><option value="idle">Idle</option><option value="walk">Walk</option><option value="work">Working</option><option value="sit">Sitting</option><option value="talk">Talking</option><option value="strike">Blade strike</option></select></label><label>Task<select id="task"><option value="general">General work</option><option value="mending">Mend</option><option value="baking">Bake</option><option value="stonework">Stonework</option><option value="writing">Write</option><option value="measuring">Measure</option><option value="ledger">Ledger</option><option value="guard">Guard</option></select></label><button id="pause">Pause</button><button id="front">Front view</button><button id="side">Side view</button><button id="rear">Rear view</button><output id="status">Loading…</output></aside>
<script type="module">
import * as THREE from 'three';import { loadMeshyNpcCatalog } from '../src/presentation/meshynpcs.ts';import { poseRig } from '../src/presentation/characters.ts';
const canvas=document.querySelector('#view'),status=document.querySelector('#status'),select=document.querySelector('#resident');document.querySelectorAll('select,button').forEach(x=>x.disabled=true);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x38434a);scene.add(new THREE.HemisphereLight(0xe1edf5,0x74624a,1.8));const key=new THREE.DirectionalLight(0xffe0b3,2.7);key.position.set(3,6,4);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-3,right:3,top:3,bottom:-3});scene.add(key);const fill=new THREE.DirectionalLight(0xa5c5e8,1);fill.position.set(-4,3,-3);scene.add(fill);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshStandardMaterial({color:0x64675b,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(24,48,0x979a88,0x777c6e);grid.position.y=.002;scene.add(grid);
const camera=new THREE.PerspectiveCamera(36,1,.05,100);let yaw=.4,pitch=.1,dist=4.5,time=0,paused=false,rig,entry,catalog,role;
try{catalog=await loadMeshyNpcCatalog((done,total)=>status.textContent=`Loading ${done} / ${total} residents…`);for(const [r,id] of Object.entries(catalog.manifest.roles)){const o=document.createElement('option');o.value=r;o.textContent=id.replaceAll('-',' ');select.append(o);}role=new URLSearchParams(location.search).get('role')??'named:shrine_warden';select.value=role;
const choose=()=>{if(rig){scene.remove(rig.root);const resources=new Set();rig.root.traverse(o=>{if(o.isMesh){resources.add(o.geometry);for(const m of Array.isArray(o.material)?o.material:[o.material]){resources.add(m);for(const x of Object.values(m))if(x?.isTexture)resources.add(x);}}if(o.isSkinnedMesh)resources.add(o.skeleton);});resources.forEach(x=>x.dispose());}role=select.value;entry=catalog.manifest.assets.find(x=>x.id===catalog.manifest.roles[role]);rig=catalog.create(role,1,role.startsWith('enemy:')?'blade':'none');scene.add(rig.root);time=0;};select.onchange=choose;choose();document.querySelectorAll('select,button').forEach(x=>x.disabled=false);}catch(error){status.textContent=String(error);throw error;}
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause';};document.querySelector('#front').onclick=()=>{yaw=0;pitch=.08;};document.querySelector('#side').onclick=()=>{yaw=Math.PI/2;pitch=.08;};document.querySelector('#rear').onclick=()=>{yaw=Math.PI;pitch=.08;};let pointer=null;canvas.onpointerdown=e=>{pointer={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);};canvas.onpointerup=()=>pointer=null;canvas.onpointermove=e=>{if(pointer){yaw-=(e.clientX-pointer.x)*.008;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-pointer.y)*.005,-.15,.75);pointer={x:e.clientX,y:e.clientY};}};canvas.addEventListener('wheel',e=>{e.preventDefault();dist=THREE.MathUtils.clamp(dist+e.deltaY*.004,2.2,10);},{passive:false});
let previous=performance.now();function frame(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;if(!paused){time+=dt;const mode=document.querySelector('#motion').value;poseRig(rig,{mode,speed:mode==='walk'?.78:0,time:time*(mode==='walk'?1.55/(1.48*rig.height/1.8):1),t:(time%1.6)/1.6,amp:1,workGesture:document.querySelector('#task').value},dt);grid.position.z=mode==='walk'?-(time*1.55%.5):0;}const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.setViewOffset(w,h,-Math.round(w*.15),0,w,h);camera.updateProjectionMatrix();camera.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,1.0+Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist);camera.lookAt(0,1.0,0);renderer.render(scene,camera);let actual=0;rig.root.traverse(o=>{if(o.isMesh)actual+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3;});status.textContent=`${actual.toLocaleString()} total triangles\n50,000 limit · ${entry.height.toFixed(2)} m\n11 skinned joints · whole-UV paint\n${(entry.bytes/1048576).toFixed(2)} MiB model\nDerived game motion`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
