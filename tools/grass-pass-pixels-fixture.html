<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}canvas{display:block}</style></head><body><script>window.addEventListener('error',e=>window.fixtureError=e.message);window.addEventListener('unhandledrejection',e=>window.fixtureError=String(e.reason));</script><script type="module">
import * as THREE from 'three';

const {createGrassMaterial}=await import(mode==='baseline'?'/@baseline-grass':'/src/presentation/grass/grassMaterial.ts');
const wind=new GrassWind({direction:[1,0],steady:0,gust:0,speed:0});

const original=createGrassClump({blades:6,segments:3}),geo=new THREE.InstancedBufferGeometry();for(const[k,a]of Object.entries(original.attributes))geo.setAttribute(k,a);geo.setIndex(original.index);

for(let i=0;i<16;i++){geo.getAttribute('aBase').setXYZW(i,2+(i%4)*2,0,2+Math.floor(i/4)*2,.01);geo.getAttribute('aShape').setXYZW(i,0,.7,1,.5);geo.getAttribute('aTint').setXYZW(i,.3,.6,.2,1);geo.getAttribute('aSlope').setXYZW(i,0,0,0,1);}

const copyScene=new THREE.Scene(),copyCamera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);copyScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.MeshBasicMaterial({map:target.texture,toneMapped:false})));

</script></body></html>
