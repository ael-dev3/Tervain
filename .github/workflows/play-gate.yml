name: Play gate

# The play gate (tools/play-gate.mjs) plays the game on a GPU with real input, which hosted runners cannot do. It is
# run on a machine with a GPU against a preview of the pull request's head (`--against head`); its summary ends with
# `play-gate: PASS <commit>`. This check passes when the pull request's description or a comment carries that line for
# the current head commit, and sets the `play-gate` status branch protection requires.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  play-gate:
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Look for a passing play gate on the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          short=${head:0:7}
          text=$( { gh api "repos/$REPO/pulls/$PR" --jq '.body // ""'; gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[].body'; } )
          if grep -Eq "play-gate: PASS ${short}[0-9a-f]*" <<<"$text"; then
            state=success; desc="Play gate passed on $short"
          else
            state=failure; desc="No play-gate PASS line for $short (npm run play-gate -- --against head)"
          fi
          gh api "repos/$REPO/statuses/$head" -f state=$state -f context=play-gate -f description="$desc" >/dev/null
          echo "$desc"
