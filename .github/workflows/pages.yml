name: Check and publish the prototype

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The site is published from the build alone, so a merge reaches the live link in minutes. Every change to main came
  # through a pull request whose tests ran here first; the tests still run on main below, alongside the publish.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Scenario tests (shard ${{ matrix.shard }} of 4)
        run: npx vitest run --shard=${{ matrix.shard }}/4 --exclude tests/gothic3-dialogue/engine-io-frame.test.ts --exclude tests/gothic3-dialogue/shared-crt-heap.test.ts --exclude 'tests/gothic3-dialogue/browser-*.test.ts' --testTimeout=90000

  # This source-backed CRT suite is another single large file, so split it by listed test names before the normal
  # file shards run. Without this, shard 1 carries the whole file and becomes the workflow tail.
  test-shared-crt-heap:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Shared CRT heap suite (name shard ${{ matrix.shard }} of 4)
        run: |
          pattern=$(node tools/vitest-name-shard.mjs tests/gothic3-dialogue/shared-crt-heap.test.ts ${{ matrix.shard }}/4)
          npx vitest run tests/gothic3-dialogue/shared-crt-heap.test.ts --testNamePattern "$pattern" --testTimeout=90000

  # The original-engine browser start-ups each run for tens of seconds of CPU and time out when two share a runner's
  # cores, so they run one at a time in their own job.
  test-engine-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Original engine browser start-ups, one at a time
        run: npx vitest run 'tests/gothic3-dialogue/browser-' --maxWorkers=1 --testTimeout=90000

  # Vitest shards by file, while this source-backed suite is one large file. Split it by listed test names so no single
  # hosted job carries the full original-engine execution tail.
  test-engine-io:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Original engine I/O frame suite (name shard ${{ matrix.shard }} of 4)
        # Its tests run for longer than vitest's 20 s default on a hosted runner.
        run: |
          pattern=$(node tools/vitest-name-shard.mjs tests/gothic3-dialogue/engine-io-frame.test.ts ${{ matrix.shard }}/4)
          npx vitest run tests/gothic3-dialogue/engine-io-frame.test.ts --testNamePattern "$pattern" --testTimeout=180000

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
